<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>List of all builds</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 0 auto;
        }
        th, td {
            border: 1px solid; /* Add border to cells */
            padding: 8px;
            text-align: left;
        }
        tr:hover {
            background-color: #bababa; /* Highlight row on hover */
        }
        a {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
    <h1>List of all Builds</h1>
</div>
<table>
    <thead>
        <tr>
            <th>Commit ID</th>
            <th>Build date</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="build : ${builds}">
            <td>
                <a th:href="@{|/builds/${build.commit}|}">
                    <span th:text="${build.commit}" />
                </a>
            </td>
            <td>
                <a th:href="@{|/builds/${build.commit}|}">
                    <span th:text="${build.date}" />
                </a>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
